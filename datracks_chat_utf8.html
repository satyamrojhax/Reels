    // --- Core Functions ---
    function setLanguage(lang) {
        currentStrings = translations[lang] || translations['en'];
        document.documentElement.lang = lang;
        localStorage.setItem('datracks-language', lang);
        
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if (currentStrings[key]) el.textContent = currentStrings[key];
        });

        messageInput.placeholder = currentStrings.messagePlaceholder;
        
        renderChatHistory();
        const currentChat = chats.find(c => c.id === currentChatId);
        if (!currentChat || currentChat.messages.length === 0) showWelcomeScreen();
    }
    
    function initApp() {
        loadChats();
        setupEventListeners();
        checkThemePreference();
        
        const savedLang = localStorage.getItem('datracks-language');
        const browserLang = (navigator.language || navigator.userLanguage).split('-')[0];
        setLanguage(savedLang || browserLang);

        if (window.innerWidth >= 1024) showSidebar(false); else hideSidebar();
        if (chats.length === 0) createNewChat(); else loadChat(chats[0].id);
        
        messageInput.style.overflowY = 'hidden';
        autoResizeTextarea();
    }

    function setupEventListeners() {
        sendButton.addEventListener('click', handleSubmit);
        chatForm.addEventListener('submit', (e) => { e.preventDefault(); handleSubmit(); });
        messageInput.addEventListener('input', () => { sendButton.disabled = messageInput.value.trim() === '' && !attachedImage; autoResizeTextarea(); });
        messageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSubmit(); } });
        newChatBtn.addEventListener('click', createNewChat);
        themeToggle.addEventListener('click', toggleTheme);
        menuToggle.addEventListener('click', toggleSidebar);
        sidebarOverlay.addEventListener('click', hideSidebar);
        imageUpload.addEventListener('change', handleImageUpload);
        removeImageBtn.addEventListener('click', removeAttachedImage);
        languageSelector.addEventListener('click', (e) => { if(e.target.dataset.lang) setLanguage(e.target.dataset.lang); });
        chatMessages.addEventListener('click', (e) => {
            const promptCard = e.target.closest('.prompt-card');
            if (promptCard) {
                messageInput.value = promptCard.dataset.prompt;
                sendButton.disabled = false;
                autoResizeTextarea();
                messageInput.focus();
            }
        });
        window.addEventListener('resize', () => { if (window.innerWidth >= 1024) showSidebar(false); else hideSidebar(); });
    }
    
    // --- UI & Chat Logic ---
    function autoResizeTextarea() {
        messageInput.style.height = 'auto';
        const newHeight = Math.min(messageInput.scrollHeight, 150);
        messageInput.style.height = `${newHeight}px`;
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) { alert(currentStrings.imageTooLarge); return; }
        const reader = new FileReader();
        reader.onload = e => {
            attachedImage = { data: e.target.result.split(',')[1], mimeType: file.type, previewUrl: e.target.result };
            imagePreview.src = e.target.result;
            imagePreviewContainer.classList.remove('hidden');
            sendButton.disabled = false;
        }
        reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
        attachedImage = null;
        imagePreview.src = '';
        imagePreviewContainer.classList.add('hidden');
        imageUpload.value = '';
        sendButton.disabled = messageInput.value.trim() === '';
    }

    async function handleSubmit() {
        const messageText = messageInput.value.trim();
        if ((!messageText && !attachedImage) || isSending) return;
        if (!currentChatId) createNewChat();
        
        isSending = true;
        sendButton.disabled = true;
        addMessageToUI('user', messageText, attachedImage ? attachedImage.previewUrl : null);
        
        const currentChat = chats.find(chat => chat.id === currentChatId);
        currentChat.messages.push({ role: 'user', content: messageText });
        if (currentChat.title === currentStrings.default_chat_title) {
            currentChat.title = messageText.substring(0, 30) + (messageText.length > 30 ? '...' : '');
        }
        
        const payload = { messages: currentChat.messages, image: attachedImage };
        removeAttachedImage();
        messageInput.value = '';
        autoResizeTextarea();
        scrollToBottom();
        typingIndicator.classList.remove('hidden');

        try {
            const response = await getAIResponse(payload);
            typingIndicator.classList.add('hidden');
            addMessageToUI('assistant', response);
            currentChat.messages.push({ role: 'assistant', content: response });
            updateCurrentChat(currentChat);
        } catch (error) {
            console.error('Error:', error);
            typingIndicator.classList.add('hidden');
            addMessageToUI('assistant', currentStrings.errorOccurred + error.message);
        } finally {
            isSending = false;
            sendButton.disabled = messageInput.value.trim() === '';
            scrollToBottom();
            messageInput.focus();
        }
    }

    async function getAIResponse(payload) {
        const response = await fetch('api-gemini.php', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.error?.message || 'API request failed'); }
        const result = await response.json();
        if (result.reply) return result.reply;
        throw new Error("Invalid response structure from API.");
    }

    function addMessageToUI(role, content, imageUrl = null) {
        if (chatMessages.querySelector('.welcome-screen')) chatMessages.innerHTML = '';
        const messageDiv = document.createElement('div');
        messageDiv.className = 'py-4 border-b border-gray-100 dark:border-gray-700';
        const iconClass = role === 'user' ? 'fa-user' : 'fa-robot';
        const bgColor = role === 'user' ? 'bg-gray-500' : 'bg-primary';
        
        let imageHTML = imageUrl ? `<img src="${imageUrl}" class="mt-2 rounded-lg max-w-xs border border-gray-200 dark:border-gray-700" alt="User upload">` : '';
        const formattedContent = formatMessage(content);
        messageDiv.innerHTML = `
            <div class="flex items-start gap-4">
                <div class="w-8 h-8 rounded-full ${bgColor} flex items-center justify-center flex-shrink-0"><i class="fas ${iconClass} text-white text-sm"></i></div>
                <div class="flex-1 markdown">${imageHTML}${formattedContent}</div>
            </div>`;
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }
    
    function formatMessage(content) {
        if (!content) return '';
        content = escapeHtml(content);
        let formatted = content.replace(/```([\w]*)\n([\s\S]*?)```/g, (match, lang, code) => {
            const langDisplay = lang || 'text';
            return `</div></div><div class="code-block relative"><div class="code-header"><span class="font-mono">${langDisplay}</span><button class="copy-code-btn" onclick="copyToClipboard(this)" data-code="${encodeURIComponent(unescapeHtml(code))}"><i class="fas fa-copy"></i> <span data-translate="copy">${currentStrings.copy}</span></button></div><pre class="!mt-0 rounded-t-none"><code class="language-${langDisplay}">${unescapeHtml(code).trim()}</code></pre></div><div class="flex-1 markdown"><div>`;
        });
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code class="bg-gray-100 dark:bg-gray-800 px-1 py-0.5 rounded text-sm">$1</code>');
        return formatted.split('\n').map(p => p.trim() ? `<p>${p}</p>` : '').join('');
    }

    function escapeHtml(text) { return text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]); }
    function unescapeHtml(text) { return text.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#039;/g, "'");}

    window.copyToClipboard = function(button) {
        const code = decodeURIComponent(button.getAttribute('data-code'));
        navigator.clipboard.writeText(code).then(() => {
            button.innerHTML = `<i class="fas fa-check"></i> <span data-translate="copied">${currentStrings.copied}</span>`;
            setTimeout(() => { button.innerHTML = `<i class="fas fa-copy"></i> <span data-translate="copy">${currentStrings.copy}</span>`; }, 2000);
        });
    }

    function scrollToBottom() { setTimeout(() => { chatContainer.scrollTop = chatContainer.scrollHeight; }, 100); }

    function createNewChat() {
        const newChat = { id: Date.now().toString(), title: currentStrings.default_chat_title, messages: [] };
        chats.unshift(newChat);
        saveChats();
        renderChatHistory();
        loadChat(newChat.id);
        if (window.innerWidth < 1024) hideSidebar();
    }

    function loadChat(chatId) {
        currentChatId = chatId;
        document.querySelectorAll('.chat-item').forEach(item => {
            item.classList.toggle('bg-light-hover', item.dataset.id === chatId);
            item.classList.toggle('dark:bg-dark-hover', item.dataset.id === chatId);
        });
        chatMessages.innerHTML = '';
        removeAttachedImage();
        const currentChat = chats.find(chat => chat.id === chatId);
        if (currentChat.messages.length === 0) showWelcomeScreen();
        else currentChat.messages.forEach(message => addMessageToUI(message.role, message.content));
        if (window.innerWidth < 1024) hideSidebar();
    }

    function showWelcomeScreen() {
        const prompts = [...currentStrings.prompts].sort(() => 0.5 - Math.random()).slice(0, 4);
        const promptsHTML = prompts.map(p => `<div class="p-4 border border-gray-200 dark:border-gray-700 rounded-lg hover:bg-light-hover dark:hover:bg-dark-hover cursor-pointer transition-colors prompt-card" data-prompt="${p.title} ${p.subtitle}"><h3 class="font-semibold mb-2">${p.title}</h3><p class="text-sm text-gray-600 dark:text-gray-400">${p.subtitle}</p></div>`).join('');
        chatMessages.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-center p-6 welcome-screen"><div class="mb-8"><i class="fas fa-robot text-5xl text-primary mb-4"></i><h2 class="text-2xl font-bold mb-2">${currentStrings.welcome_title}</h2><p class="text-gray-600 dark:text-gray-400">${currentStrings.welcome_subtitle}</p></div><div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">${promptsHTML}</div></div>`;
    }

    function deleteChat(chatId) {
        if (!confirm(currentStrings.delete_confirm)) return;
        chats = chats.filter(chat => chat.id !== chatId);
        saveChats();
        renderChatHistory();
        if (chats.length === 0) createNewChat();
        else if (chatId === currentChatId) loadChat(chats[0].id);
    }

    function updateCurrentChat(chat) {
        const index = chats.findIndex(c => c.id === chat.id);
        if (index !== -1) {
            chats[index] = chat;
            if (index > 0) { chats.splice(index, 1); chats.unshift(chat); }
            saveChats();
            renderChatHistory();
        }
    }

    function renderChatHistory() {
        chatHistory.innerHTML = chats.length === 0 ? `<div class="text-center p-4 text-gray-500 dark:text-gray-400">${currentStrings.no_conversations}</div>` : '';
        chats.forEach(chat => {
            const chatItem = document.createElement('div');
            chatItem.className = `chat-item p-3 rounded-md flex items-center justify-between cursor-pointer hover:bg-light-hover dark:hover:bg-dark-hover transition-colors`;
            chatItem.dataset.id = chat.id;
            if (chat.id === currentChatId) chatItem.classList.add('bg-light-hover', 'dark:bg-dark-hover');
            chatItem.innerHTML = `<div class="flex items-center gap-2 overflow-hidden flex-1"><i class="far fa-comment-alt text-gray-500 dark:text-gray-400"></i><span class="chat-title truncate">${escapeHtml(chat.title)}</span></div><div class="flex items-center gap-1"><button class="rename-chat-btn text-gray-500 hover:text-blue-500 p-1"><i class="fas fa-edit"></i></button><button class="delete-chat-btn text-gray-500 hover:text-red-500 p-1"><i class="fas fa-trash-alt"></i></button></div>`;
            chatItem.addEventListener('click', (e) => { if (!e.target.closest('button')) loadChat(chat.id); });
            chatItem.querySelector('.delete-chat-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(chat.id); });
            chatItem.querySelector('.rename-chat-btn').addEventListener('click', (e) => { e.stopPropagation(); renameChat(chat.id); });
            chatHistory.appendChild(chatItem);
        });
    }

    function renameChat(chatId) {
        const chat = chats.find(c => c.id === chatId);
        if (!chat) return;
        const newTitle = prompt(currentStrings.rename_prompt, chat.title);
        if (newTitle && newTitle.trim()) {
            chat.title = newTitle.trim();
            saveChats();
            renderChatHistory();
        }
    }

    function loadChats() { chats = JSON.parse(localStorage.getItem('datracks-chats')) || []; }
    function saveChats() { localStorage.setItem('datracks-chats', JSON.stringify(chats)); }
    function toggleSidebar() { if (sidebar.style.transform === 'translateX(0px)') hideSidebar(); else showSidebar(); }
    function showSidebar(showOverlay = true) { sidebar.style.transform = 'translateX(0)'; if (showOverlay && window.innerWidth < 1024) sidebarOverlay.style.display = 'block'; }
    function hideSidebar() { sidebar.style.transform = 'translateX(-100%)'; sidebarOverlay.style.display = 'none'; }
    
    function checkThemePreference() {
        const savedTheme = localStorage.getItem('datracks-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }
    
    function toggleTheme() {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('datracks-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }

    document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
